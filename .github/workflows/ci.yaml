name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Nightly drift catcher — picks up breakage from new HA releases,
  # plugin updates and OS-image rolls without waiting for a PR.
  # Off-hour minute (17) keeps us out of the :00 thundering herd.
  schedule:
    - cron: "17 4 * * *"
  # Callable from release.yaml so a tag cannot be published without the
  # very same lint + test gate that guards main.  A tag push does NOT
  # match the `push: branches` trigger above, so without this the release
  # job would run on completely untested code.
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.7.9"
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install ruff
        run: uv pip install --constraint=.github/workflows/constraints.txt ruff
      - name: Ruff check
        run: ruff check custom_components/
      - name: Ruff format check
        run: ruff format --check custom_components/
      - name: Codegen drift check
        run: python tools/codegen.py --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 dropped: HA 2026.4+ and pytest-homeassistant-custom-component
        # 0.13.317+ require 3.14, so a 3.13 leg could only ever install an
        # ancient HA and told us nothing about what users run.
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        id: deps
        # Tool pins live in .github/workflows/constraints.txt.
        run: |
          # NOTE: the project itself is deliberately NOT installed. It is a
          # HACS custom component, not a library: tests import
          # `custom_components.sber_mqtt_bridge` straight from the checkout
          # (pytest puts rootdir on sys.path), exactly as they do locally.
          # An editable install registers an `__editable__…finder` path hook
          # that raises FileNotFoundError while Home Assistant's integration
          # loader scans sys.path — which broke every full-HA test as soon as
          # the config_flow suite started running in CI.
          uv pip install --constraint=.github/workflows/constraints.txt \
            aiomqtt pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout \
            pytest-homeassistant-custom-component syrupy pydantic ruff
      - name: Install hass_frontend (required by config_flow tests)
        # The config_flow tests set up HA's `frontend` component, which
        # imports the `hass_frontend` module. It is NOT a transitive
        # dependency of pytest-homeassistant-custom-component, so without
        # it the whole config_flow suite errors out — that is why it used
        # to be excluded via `-k "not test_config_flow"`.
        # The exact version is pinned by the installed HA release itself.
        run: |
          REQ=$(python -c "import json,pathlib,homeassistant.components.frontend as f; \
            print(json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text())['requirements'][0])")
          echo "Installing $REQ"
          uv pip install "$REQ"
      - name: Run tests
        # -n auto      parallel across CPU cores (3× on GitHub runners)
        # --timeout    kills hung tests instead of timing out the whole job
        # --durations  surfaces the slowest 10 tests every run
        run: |
          pytest tests/hacs/ \
            -o asyncio_mode=auto \
            -n auto \
            --timeout=30 \
            --durations=10 \
            --cov=custom_components/sber_mqtt_bridge \
            --cov-report=term-missing \
            --cov-report=xml
      - name: Install mypy
        # Runs in this job, not in Lint: mypy needs Home Assistant installed
        # to resolve `homeassistant.*` types.  `!cancelled()` keeps the type
        # check running when tests fail, so both results show up in one run.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv pip install --constraint=.github/workflows/constraints.txt mypy
      - name: Mypy
        # Modules with type errors that predate this gate are listed in
        # [[tool.mypy.overrides]] in pyproject.toml (a ratchet); every other
        # module — and every new one — must type-check cleanly.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mypy custom_components/sber_mqtt_bridge/

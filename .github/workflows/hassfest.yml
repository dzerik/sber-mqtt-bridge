name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master@2026-09-10

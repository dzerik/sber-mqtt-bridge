name: Release

on:
  push:
    tags:
      - "v*"

# Nothing by default; each job asks for exactly what it needs.  The CI gate
# only reads the code, so it must not inherit the release job's write token.
permissions: {}

jobs:
  # Gate: the full CI workflow (lint + test matrix) must be green for the
  # tagged commit before anything is built, signed or published.  v1.47.0
  # shipped broken because the release path had no such gate.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  release:
    name: Create Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # Upload the GitHub release and its assets.
      contents: write
      # Required by sigstore/gh-action-sigstore-python for keyless OIDC signing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git; do not leave the write token in
          # .git/config for the build steps.
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest.json version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/sber_mqtt_bridge/manifest.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build HACS zip
        run: |
          cd custom_components/sber_mqtt_bridge
          zip -r "${GITHUB_WORKSPACE}/sber_mqtt_bridge.zip" . \
            -x "*__pycache__*" "*.pyc" "*.pyo"

      # Keyless signing via Sigstore (OIDC, no secrets).
      # sigstore-python v3.x writes the bundle as <input>.sigstore.json
      # (older v3.0.x wrote <input>.sigstore) — any downstream consumer
      # can verify it with `sigstore verify identity`.
      - name: Sign release artifact (sigstore)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: sber_mqtt_bridge.zip

      # Whether this tag is a pre-release is decided by a rule, not by a
      # list.  The previous version spelled out b1/b2/b3 and nothing
      # else, so v1.51.0b4 was published as a stable release and HACS
      # would have offered a beta to every user.  PEP 440 spells
      # pre-releases as aN / bN / rcN right after the version, which is
      # exactly what tools/bump_version.py produces; the -alpha/-beta/-rc
      # spellings are accepted too, in case a tag is ever hand-made.
      - name: Decide whether this is a pre-release
        id: channel
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]] || [[ "$tag" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is a stable release"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            sber_mqtt_bridge.zip
            sber_mqtt_bridge.zip.sigstore.json
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}

  # Keep only the newest releases.  HACS offers every GitHub release as an
  # installable version, and dozens of them only bury the useful ones.
  # Only the release is deleted, never its tag: the tag still pins the
  # code, and the notes live on in CHANGELOG.md.  Runs after a successful
  # publish, so a failed build never prunes anything.
  prune:
    name: Prune old releases
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: 10
    steps:
      - name: Delete releases beyond the newest ${{ env.KEEP }}
        run: |
          gh release list --limit 1000 --exclude-drafts --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName" |
          while read -r tag; do
            echo "::notice::Deleting release $tag (tag kept)"
            gh release delete "$tag" --yes
          done

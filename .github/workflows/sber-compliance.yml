name: Sber Spec Drift Check

# Fetches canonical device schemas from developers.sber.ru weekly.
# If Sber updated the documentation, a PR is opened with the diff so
# we can audit the change and update device classes if needed.

on:
  schedule:
    - cron: "7 6 * * 1"  # Mondays 06:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-check:
    name: Fetch Sber schemas + detect drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # No browser is installed on purpose.  developers.sber.ru is
      # Docusaurus with server-side rendering, so the scraper reads the
      # pages with plain HTTP and the standard library — the run no
      # longer depends on a chromium download succeeding.  The tool can
      # still fall back to Playwright when a page arrives empty; if that
      # ever happens here it will report the page as failed (exit 1) and
      # this job will go red, which is the signal to look at the site
      # rather than to reinstall a browser.

      - name: Fetch Sber schemas
        id: fetch
        run: |
          # Exit 3 means "snapshot written, but the scraper extracted less
          # than the pages carry" — a degraded crawl, not a documentation
          # change.  The run must continue so the drift PR still gets
          # opened with whatever was captured; the warning below is what
          # tells a human to reread the log before trusting that diff.
          set +e
          python tools/fetch_sber_schemas.py
          code=$?
          set -e
          echo "degraded=$([ "$code" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "::warning::Scraper extraction is incomplete (exit 3) — see the WARN lines above."
            exit 0
          fi
          exit "$code"

      - name: Regenerate committed artifacts
        run: python tools/codegen.py

      - name: Detect drift
        id: drift
        run: |
          # sber_full_spec.json carries the ENUM vocabularies and numeric
          # ranges codegen turns into FEATURE_ENUM_VALUES / FEATURE_RANGES,
          # yet it used to be left out of this check: its `generated_at`
          # stamp changes on every run, so a naive diff always reported
          # drift.  `git diff -I<regex>` drops hunks whose changed lines all
          # match, so the stamp (and the SPEC_GENERATED_AT / "Spec generated
          # at:" lines it feeds into _generated/) is ignored while a changed
          # vocabulary or range is still caught.
          DRIFT_PATHS=(
            tests/hacs/__snapshots__/sber_schemas.json
            tests/hacs/__snapshots__/sber_full_spec.json
            custom_components/sber_mqtt_bridge/_generated
          )
          IGNORE=(
            -I '^\s*"generated_at":'
            -I '^Spec generated at:'
            -I '^SPEC_GENERATED_AT'
          )
          if git diff --exit-code --quiet "${IGNORE[@]}" -- "${DRIFT_PATHS[@]}"; then
            echo "No drift detected."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "Drift detected in Sber schemas!"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff "${IGNORE[@]}" -- "${DRIFT_PATHS[@]}" | head -300
          fi

      - name: Create drift PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/sber-spec-drift
          delete-branch: true
          title: "chore: Sber spec drift detected"
          commit-message: "chore: update Sber schemas snapshot"
          body: |
            The weekly `sber-compliance` job detected changes in
            `developers.sber.ru` documentation.

            Review the diff to decide whether our device classes need
            updates (new required features, changed enum values, etc.).

            - See `tests/hacs/__snapshots__/sber_schemas.json` and
              `sber_full_spec.json` for the full diff, plus the regenerated
              modules under `custom_components/sber_mqtt_bridge/_generated/`.
            - Compliance tests in `tests/hacs/test_sber_compliance_live.py`
              will fail if our code diverges from the new spec.

            Merge this PR only after verifying the Sber change is
            intentional and our code is updated accordingly.

            Scraper extraction incomplete: ${{ steps.fetch.outputs.degraded }}
            (when `true`, part of this diff may be the scraper losing data
            rather than Sber changing anything — check the job log).
          labels: |
            sber-drift
            automated

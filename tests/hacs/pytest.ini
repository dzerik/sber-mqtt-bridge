[pytest]
asyncio_mode = auto

# The repo root must be importable so tests can
# `import custom_components.sber_mqtt_bridge` without installing the project
# (it is a HACS component, not a library — CI deliberately does not install it,
# because an editable install breaks Home Assistant's sys.path scanning).
#
# Paths resolve relative to rootdir, which is THIS directory: pytest selects
# this file as its configfile since every invocation targets tests/hacs/.
# `python -m pytest` adds the CWD to sys.path implicitly, a bare `pytest`
# (what CI runs) does not — this line makes both invocations behave the same.
pythonpath = ../..

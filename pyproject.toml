[project]
name = "sber-mqtt-bridge"
version = "1.56.0"
description = "Sber Smart Home MQTT Bridge for Home Assistant"
requires-python = ">=3.13"
license = "MIT"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "A001",    # variable shadowing builtins
    "ASYNC",   # flake8-async
    "B",       # flake8-bugbear
    "BLE",     # blind-except
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "G",       # flake8-logging-format
    "I",       # isort
    "ICN001",  # import conventions
    "LOG",     # flake8-logging
    "N804",    # first argument of classmethod
    "N805",    # first argument of method
    "PERF",    # perflint
    "PGH",     # pygrep-hooks
    "PIE",     # misc lints
    "PT",      # flake8-pytest-style
    "RET",     # flake8-return
    "RSE",     # flake8-raise
    "RUF",     # ruff-specific rules
    "S",       # flake8-bandit (security)
    "SIM",     # flake8-simplify
    "T20",     # flake8-print
    "TRY",     # tryceratops
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
]

ignore = [
    "E501",     # line too long (handled by formatter)
    "RUF001",   # ambiguous unicode (Russian text)
    "RUF002",   # ambiguous unicode docstring
    "RUF003",   # ambiguous unicode comment
    "S101",     # assert usage (OK in tests)
    "TRY003",   # long exception message
    "TRY400",   # logging.error inside except
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
# Must match the interpreter Home Assistant is installed into: HA 2026.4+
# requires Python 3.14 and its sources use 3.14-only syntax (unparenthesised
# `except A, B:`), so with "3.13" mypy aborts on a syntax error inside
# homeassistant/ before checking a single module of ours.  The integration
# itself still runs on 3.13 — this only selects the grammar mypy parses with;
# 3.13-compatible syntax in our code is enforced by ruff `target-version`.
python_version = "3.14"
show_error_codes = true
follow_imports = "silent"
strict_equality = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_return_any = true
disable_error_code = ["import-not-found", "import-untyped"]

# ratchet: remove a module once it is clean; new modules must pass.
# These modules had type errors when mypy was added to CI (CI runs
# `mypy custom_components/sber_mqtt_bridge/`).  Everything not listed here
# is checked strictly and must stay clean.  Never add a module to this
# list to get a PR green — fix the types instead.  Module names have no
# `custom_components.` prefix: that directory is not a package, so mypy
# roots the modules at `sber_mqtt_bridge`.
[[tool.mypy.overrides]]
module = [
    "sber_mqtt_bridge.devices.base_entity",
    "sber_mqtt_bridge.devices.battery_signal_mixin",
    "sber_mqtt_bridge.devices.climate",
    "sber_mqtt_bridge.devices.curtain",
    "sber_mqtt_bridge.devices.fan_speed_mixin",
    "sber_mqtt_bridge.devices.humidifier",
    "sber_mqtt_bridge.devices.humidity_sensor",
    "sber_mqtt_bridge.devices.light",
    "sber_mqtt_bridge.devices.on_off_entity",
    "sber_mqtt_bridge.devices.sensor_air",
    "sber_mqtt_bridge.devices.sensor_temp",
    "sber_mqtt_bridge.devices.tv",
    "sber_mqtt_bridge.devices.vacuum_cleaner",
]
ignore_errors = true

# NOTE: this section is NOT the effective pytest config.  Every invocation
# targets `tests/hacs/`, so pytest picks `tests/hacs/pytest.ini` as its
# configfile and rootdir — settings here are ignored.  Keep real pytest
# settings in tests/hacs/pytest.ini.
[tool.pytest.ini_options]
testpaths = ["tests/hacs"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/sber_mqtt_bridge"]

[tool.coverage.report]
# Actual coverage is 97.4% (~4950 tests, incl. config_flow). The gate sits
# just below that so a real regression fails CI, while normal fluctuation
# does not.  At 85 a regression of ~900 statements still passed green —
# that is what this number is meant to catch.  Never lower it; raise it as
# coverage grows.
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

    </filter>
  </defs>
  <g transform="translate(32 32) scale(0.875)">
    <!-- сфера в стиле Sber -->
    <circle cx="256" cy="256" r="244" fill="url(#core)"/>
    <circle cx="256" cy="256" r="244" fill="url(#rim)"/>
    <circle cx="256" cy="256" r="244" fill="url(#topBlue)"/>
    <g clip-path="url(#ball)">
      <path d="M40 240 C 110 90, 320 60, 460 190 C 470 220, 468 250, 455 280

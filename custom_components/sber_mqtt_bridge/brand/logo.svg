      <stop offset="0.94" stop-color="#0FBFD8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2050D8" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="topBlue" x1="0.38" y1="0" x2="0.5" y2="0.55">

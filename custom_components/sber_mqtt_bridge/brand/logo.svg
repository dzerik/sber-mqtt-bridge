  <text x="516" y="232" font-family="DejaVu Sans" font-weight="bold" font-size="74" fill="#21A038">Sber MQTT</text>
  <text x="516" y="330" font-family="DejaVu Sans" font-weight="bold" font-size="74" fill="#0E7A33">Bridge</text>

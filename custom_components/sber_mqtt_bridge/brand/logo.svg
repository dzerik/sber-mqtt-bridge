      <stop offset="0.3" stop-color="#16B8E8" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#16B8E8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="256" cy="256" r="244"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">

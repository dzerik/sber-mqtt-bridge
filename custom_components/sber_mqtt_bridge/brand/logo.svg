<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512">
  <defs>
    <radialGradient id="core" cx="0.47" cy="0.66" r="0.95">
      <stop offset="0" stop-color="#F7EC1F"/>
      <stop offset="0.30" stop-color="#C9E62B"/>
      <stop offset="0.55" stop-color="#4CD854"/>
      <stop offset="0.76" stop-color="#14CE8B"/>
      <stop offset="0.88" stop-color="#0DCBC7"/>
      <stop offset="0.96" stop-color="#13B2E0"/>
      <stop offset="1" stop-color="#1E86DF"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">

      <!-- двунаправленный поток HA ⇄ Sber -->
      <g stroke="#0E7A33" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M188 276 H300"/>
        <path d="M276 246 L312 276 L276 306"/>
        <path d="M324 350 H212"/>
        <path d="M236 320 L200 350 L236 380"/>
